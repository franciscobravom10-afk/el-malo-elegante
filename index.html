<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<meta name="description" content="EME — El Malo Elegante | King of Kings Music • 1982">
<title>EME — El Malo Elegante</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,rgba(212,175,55,.14),transparent 32%),
    linear-gradient(180deg,#080808 0%,#020202 100%);
}
.wrap{min-height:100vh;display:flex;justify-content:center;padding:24px 14px}
.card{
  width:100%;max-width:560px;text-align:center;
  border:1px solid #8c7420;border-radius:30px;
  padding:30px 20px 26px;
  background:linear-gradient(180deg,#121212 0%,#050505 100%);
  box-shadow:0 0 55px rgba(212,175,55,.14);
  position:relative;overflow:hidden;
}
.card:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.035) 50%,transparent 65%);
}
.crown{font-size:48px;line-height:1;margin-bottom:5px}
.eme{
  font-size:70px;line-height:.95;font-weight:900;letter-spacing:9px;
  color:#d4af37;text-shadow:0 0 18px rgba(212,175,55,.3);
}
h1{font-family:Georgia,serif;font-size:27px;margin:12px 0 5px}
.sub{color:#d4af37;letter-spacing:2px;font-size:12px;margin-bottom:25px}
.tagline{font-family:Georgia,serif;font-style:italic;color:#ddd;margin:0 auto 24px;max-width:430px}
a{
  display:flex;align-items:center;justify-content:center;
  gap:10px;text-decoration:none;color:#fff;margin:12px 0;
  padding:17px 16px;border:1px solid #6e5b20;border-radius:17px;
  background:rgba(17,17,17,.94);font-weight:700;font-size:17px;
  transition:.2s;
}
a:hover{transform:translateY(-2px);background:#1b1b1b;border-color:#d4af37;box-shadow:0 8px 25px rgba(212,175,55,.12)}
.icon{width:28px;text-align:center;font-size:20px;color:#d4af37}
.divider{height:1px;background:linear-gradient(90deg,transparent,#6e5b20,transparent);margin:27px 0 20px}
.music{
  border:1px solid #6e5b20;border-radius:18px;padding:18px 15px;
  background:#0b0b0b;margin-bottom:18px
}
.music strong{display:block;font-family:Georgia,serif;font-size:18px;margin-bottom:5px}
.music span{font-size:13px;color:#aaa}
.foot{margin-top:22px;color:#8d8d8d;font-size:12px}
.small{color:#d4af37;font-size:11px;letter-spacing:1px;margin-top:7px}
</style>
</head>

<body>
<div class="wrap">
<main class="card">

  <div class="crown">♛</div>
  <div class="eme">EME</div>
  <h1>El Malo Elegante</h1>
  <div class="sub">KING OF KINGS MUSIC • 1982</div>

  <p class="tagline">La salsa que toca el corazón.</p>

  <div class="music">
    <strong>🎶 Música de El Malo Elegante</strong>
    <span>Escucha y descubre los nuevos lanzamientos.</span>
  </div>

  <a href="https://www.youtube.com/@ElMaloElegante" target="_blank" rel="noopener noreferrer">
    <span class="icon">▶</span> YouTube
  </a>

  <a href="https://www.facebook.com/share/18Qb3kj3fC/" target="_blank" rel="noopener noreferrer">
    <span class="icon">f</span> Facebook
  </a>

  <a href="https://wa.me/525564793269" target="_blank" rel="noopener noreferrer">
    <span class="icon">◉</span> WhatsApp
  </a>

  <a href="https://www.tiktok.com/@.francisco.bravojr4" target="_blank" rel="noopener noreferrer">
    <span class="icon">♪</span> TikTok
  </a>

  <div class="divider"></div>

  <div class="foot">EME • El Malo Elegante</div>
  <div class="small">KING OF KINGS MUSIC</div>

</main>
</div>
</body>
</html>
